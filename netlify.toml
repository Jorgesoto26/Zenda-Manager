[build]
  command = "npm run build"
  publish = "dist"

# Redirección SPA obligatoria para React Router en Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de seguridad y caché recomendados
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

